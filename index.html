<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<title>FOAO Gigantic Rocks</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<section id="gate" hidden>
  <form id="login" class="card gate" autocomplete="on">
    <span class="logo logo-gate" role="img" aria-label="FOAO"></span>
    <div class="brand" style="justify-content:center"><div><b>FOAO</b><small>Gigantic Rocks</small></div></div>
    <h1 id="gate-title">Sign in</h1>
    <p id="gate-msg" class="sub">Internal use only.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
    <button id="gate-btn" type="submit" class="primary">Sign in</button>
    <p id="gate-err" class="err" role="alert"></p>
  </form>
</section>

<div id="shell" hidden>
  <header class="top">
    <div class="brand"><span class="logo logo-header" role="img" aria-label="FOAO"></span><div><b>FOAO</b><small>Gigantic Rocks</small></div></div>
    <button id="menu" class="ghost" aria-expanded="false" aria-controls="nav" aria-haspopup="true"><span id="menu-label">Menu</span> <span aria-hidden="true">&#9662;</span></button>
    <nav id="nav">
      <a href="#markets">Markets</a><a href="#sisyphus">Sisyphus</a><a href="#stan">Stan</a><a href="#brakes">Brakes</a><a href="#annie">Annie</a><a href="#adam">Adam</a><a href="#neil">Neil</a><a href="#sven">Sven</a><a href="#kate">Kate</a><a href="#gail">Gail</a>
      <a href="#sandbox">Sandbox</a>
    </nav>
    <div class="tools"><a href="#admin" class="navlink">Admin</a><button id="theme" aria-label="Toggle theme">◐</button><button id="signout" class="ghost">Sign out</button></div>
  </header>
  <main id="app"></main>
  <div id="scrim" hidden></div><aside id="drawer" hidden></aside>
  <footer>Subjective estimates, not advice. Loadings are drafts until reviewed. <span id="stamp"></span> · build <span id="build">__BUILD__</span></footer>
</div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="vendor/world-regions.js"></script>
<script src="app.js"></script>
</body>
</html>
